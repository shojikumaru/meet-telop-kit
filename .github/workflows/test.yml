name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # scripts/setup.sh installs the apt packages through sudo (passwordless on GitHub-hosted runners) and the
      # Python venv into ~/.cache/meet-telop/venv; tests/smoke.sh then uses that venv's python
      - name: setup
        run: bash scripts/setup.sh
      - name: make test
        run: make test
