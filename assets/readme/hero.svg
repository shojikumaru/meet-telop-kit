<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="meet-telop-kit: interview recording to telop video">
  <defs>
    <linearGradient id="qbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#F107A3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7A8"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="chipA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A6CFF"/>
      <stop offset="1" stop-color="#0047B3"/>
    </linearGradient>
    <linearGradient id="chipB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF3D7F"/>
      <stop offset="1" stop-color="#C2185B"/>
    </linearGradient>
    <g id="person">
      <circle cx="0" cy="-34" r="26" fill="#8C90A8"/>
      <path d="M -52 40 C -52 0 -28 -4 0 -4 C 28 -4 52 0 52 40 Z" fill="#8C90A8"/>
    </g>
    <g id="frame">
      <rect x="0" y="0" width="480" height="270" rx="18" fill="#2B2D42"/>
      <rect x="16" y="16" width="218" height="238" rx="10" fill="#3D4159"/>
      <rect x="246" y="16" width="218" height="238" rx="10" fill="#3D4159"/>
      <use href="#person" x="125" y="170"/>
      <use href="#person" x="355" y="170"/>
    </g>
  </defs>

  <rect width="1280" height="640" fill="#FBF6EE"/>

  <text x="640" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#23233A">meet-telop-kit</text>

  <!-- left: the recording as it is -->
  <g transform="translate(70 180)">
    <use href="#frame"/>
    <circle cx="448" cy="34" r="9" fill="#E6002E"/>
  </g>

  <!-- arrow -->
  <g transform="translate(590 315)">
    <rect x="0" y="-9" width="66" height="18" rx="9" fill="#FF7A00"/>
    <path d="M 58 -30 L 100 0 L 58 30 Z" fill="#FF7A00" stroke="#FF7A00" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- right: the same frame dressed with telops -->
  <g transform="translate(730 180)">
    <use href="#frame"/>

    <!-- Q header -->
    <rect x="44" y="26" width="196" height="40" rx="20" fill="url(#qbar)" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="44" cy="46" r="25" fill="#FFE94D" stroke="#FFFFFF" stroke-width="3"/>
    <text x="44" y="54" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3A0CA3">Q1</text>
    <rect x="82" y="40" width="138" height="12" rx="6" fill="#FFFFFF"/>

    <!-- gold pop -->
    <g font-family="Helvetica, Arial, sans-serif" font-size="78" font-weight="900" text-anchor="middle" stroke-linejoin="round">
      <text x="360" y="132" fill="none" stroke="#1A1030" stroke-width="22">3x</text>
      <text x="360" y="132" fill="none" stroke="#FFFFFF" stroke-width="15">3x</text>
      <text x="360" y="132" fill="none" stroke="#E6002E" stroke-width="7">3x</text>
      <text x="360" y="132" fill="url(#gold)">3x</text>
    </g>

    <!-- name plates -->
    <g transform="translate(26 136)">
      <rect x="0" y="0" width="92" height="22" rx="7" fill="url(#chipA)"/>
      <rect x="0" y="20" width="150" height="38" rx="7" fill="#FFFFFF" stroke="#0A6CFF" stroke-width="4"/>
      <rect x="14" y="33" width="96" height="12" rx="6" fill="#1A1030"/>
    </g>
    <g transform="translate(298 136)">
      <rect x="0" y="0" width="70" height="22" rx="7" fill="url(#chipB)"/>
      <rect x="0" y="20" width="150" height="38" rx="7" fill="#FFFFFF" stroke="#FF3D7F" stroke-width="4"/>
      <rect x="14" y="33" width="110" height="12" rx="6" fill="#1A1030"/>
    </g>

    <!-- subtitle -->
    <rect x="124" y="208" width="60" height="20" rx="10" fill="url(#chipA)" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="118" y="226" width="244" height="30" rx="15" fill="#FFFFFF" stroke="#0A6CFF" stroke-width="6"/>
  </g>

  <text x="640" y="548" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#4A4A5E">Interview recording → telop video</text>
</svg>
